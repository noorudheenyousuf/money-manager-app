<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092218" />
      <stop offset="50%" stop-color="#051710" />
      <stop offset="100%" stop-color="#020c08" />
    </linearGradient>
    <!-- Chart Neon Green Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ff493" />
      <stop offset="40%" stop-color="#3de87c" />
      <stop offset="100%" stop-color="#22d66c" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Background -->
  <rect width="1024" height="1024" fill="#000000" />

  <!-- Rounded Squircle -->
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#squircleBg)" />

  <!-- L-Axis (Vertical and Horizontal) -->
  <path d="M 280 304 L 328 304 L 328 666 L 744 666 L 744 714 L 280 714 Z" fill="url(#neonGreen)" />

  <!-- Bar 1 (Left) -->
  <rect x="363" y="428" width="86" height="238" fill="url(#neonGreen)" />

  <!-- Bar 2 (Middle, Tallest) -->
  <rect x="485" y="357" width="86" height="309" fill="url(#neonGreen)" />

  <!-- Bar 3 (Right) -->
  <rect x="606" y="508" width="85" height="158" fill="url(#neonGreen)" />
</svg>